interface:
  display_name: "Massed Compute (legacy alias)"
  short_description: "Legacy Massed adapter for remote-compute-ops"
  default_prompt: "Use $remote-compute-ops for the canonical remote-compute workflow; load Massed recipes only when the target is Massed Compute."
dependencies:
  tools:
    - type: "mcp"
      value: "massed-compute"
      description: "Massed Compute account and GPU VM operations"
      transport: "streamable_http"
